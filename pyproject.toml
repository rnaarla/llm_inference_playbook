[tool.pytest.ini_options]
testpaths = ["impl/tests", "impl/gateway/admission", "playbook/ci"]
pythonpath = [".", "impl"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["impl"]
omit = [
  "impl/tests/*",
  "impl/**/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"impl/tests/**/*.py" = ["S101"]
"playbook/ci/test_*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false

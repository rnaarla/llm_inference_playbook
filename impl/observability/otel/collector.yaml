receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB}
  batch:
  resource/inference:
    attributes:
      - key: service.namespace
        value: ${env:OTEL_SERVICE_NAMESPACE}
        action: upsert

exporters:
  otlp:
    endpoint: ${env:OTLP_ENDPOINT}
    tls:
      insecure: ${env:OTLP_TLS_INSECURE}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/inference, batch]
      exporters: [otlp]

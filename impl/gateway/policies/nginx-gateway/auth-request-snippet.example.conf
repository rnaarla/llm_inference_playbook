# Example NGINX auth_request integration. Convert to the selected NGINX Gateway
# extension mechanism for your controller version.
location = /_admit {
  internal;
  proxy_method POST;
  proxy_pass http://REPLACE_WITH_ADMISSION_SERVICE_NAME.REPLACE_WITH_INFERENCE_NAMESPACE.svc.cluster.local:8080/admit;
  proxy_set_header X-Tenant-ID $http_x_tenant_id;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Content-Type application/json;
  proxy_pass_request_body on;
}

location /v1/ {
  auth_request /_admit;
  auth_request_set $priority_class $upstream_http_x_priority_class;
  auth_request_set $served_model $upstream_http_x_served_model;
  proxy_set_header X-Priority-Class $priority_class;
  proxy_set_header X-Served-Model $served_model;
  proxy_pass http://REPLACE_WITH_ENGINE_SERVICE_NAME.REPLACE_WITH_INFERENCE_NAMESPACE.svc.cluster.local:8000;
}

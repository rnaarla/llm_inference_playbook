apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference-engine.name" . }}
  labels:
    {{- include "inference-engine.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "inference-engine.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}

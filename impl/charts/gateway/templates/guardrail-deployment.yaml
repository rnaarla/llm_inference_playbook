{{- if .Values.guardrails.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-gateway.guardrailName" . }}
spec:
  replicas: {{ .Values.guardrails.replicas }}
  selector:
    matchLabels:
      app: {{ include "inference-gateway.guardrailName" . }}
  template:
    metadata:
      labels:
        app: {{ include "inference-gateway.guardrailName" . }}
    spec:
      containers:
        - name: guardrails
          image: "{{ .Values.guardrails.image.repository }}:{{ .Values.guardrails.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: GUARDRAIL_CONFIG
              value: /config/guardrails.yaml
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
      volumes:
        - name: config
          configMap:
            name: {{ .Values.guardrails.configName }}
{{- end }}

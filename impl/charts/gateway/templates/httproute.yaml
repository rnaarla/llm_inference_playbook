apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inference-gateway.name" . }}-openai
spec:
  parentRefs:
    - name: {{ include "inference-gateway.name" . }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Inference-Gateway
                value: {{ include "inference-gateway.name" . | quote }}
      backendRefs:
        - name: {{ .Values.engine.serviceName }}
          port: {{ .Values.engine.servicePort }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inference-gateway.name" . }}-policy
data:
  policy.yaml: |
    # Controller-specific integration point.
    #
    # For kgateway/Envoy-based deployments, translate this policy into the
    # provider's ext_authz / ExternalAuthPolicy / WASM attachment.
    ext_authz:
      enabled: {{ .Values.policy.extAuthz.enabled }}
      service: {{ .Values.policy.extAuthz.serviceName }}
      port: {{ .Values.policy.extAuthz.servicePort }}
      path: {{ .Values.policy.extAuthz.path }}
    retry_budget:
      enabled: {{ .Values.policy.retryBudget.enabled }}
      max_retries: {{ .Values.policy.retryBudget.maxRetries }}
      per_try_timeout: {{ .Values.policy.retryBudget.perTryTimeout }}
    audit:
      request_id_header: {{ .Values.policy.audit.requestIdHeader }}
      tenant_header: {{ .Values.policy.audit.tenantHeader }}
    guardrails:
      enabled: {{ .Values.policy.guardrails.enabled }}
      service: {{ .Values.policy.guardrails.serviceName }}
      port: {{ .Values.policy.guardrails.servicePort }}
      path: {{ .Values.policy.guardrails.path }}
      config: {{ .Values.policy.guardrails.configName }}
      default_route: {{ .Values.policy.guardrails.defaultRoute }}
      failure_mode: {{ .Values.policy.guardrails.failureMode }}
    keepalive:
      http2_ping_interval: {{ .Values.policy.keepalive.http2PingInterval }}
      tcp_keepalive_time: {{ .Values.policy.keepalive.tcpKeepaliveTime }}

# Environment-specific values for the implementation scaffold.
#
# Copy this file to an ignored environment-specific file or materialize it from
# your parameter store / secret manager at deploy time. Do not commit real
# account IDs, endpoints, hostnames, secrets, certificates, or regional policy.

environment:
  name: REPLACE_WITH_ENVIRONMENT_NAME
  region: REPLACE_WITH_REGION
  compliance_profile: REPLACE_WITH_COMPLIANCE_PROFILE

kubernetes:
  namespace: REPLACE_WITH_INFERENCE_NAMESPACE
  monitoring_namespace: REPLACE_WITH_MONITORING_NAMESPACE
  gateway_class_name: REPLACE_WITH_GATEWAY_CLASS

network:
  public_hostname: REPLACE_WITH_INFERENCE_HOSTNAME
  gateway_listener_port: 80
  gateway_label:
    role: REPLACE_WITH_GATEWAY_ROLE_LABEL
  monitoring_namespace_label:
    kubernetes.io/metadata.name: REPLACE_WITH_MONITORING_NAMESPACE

registry:
  model_artifact: oci://REPLACE_WITH_REGISTRY_HOST/models/REPLACE_WITH_MODEL@REPLACE_WITH_APPROVED_MODEL_DIGEST
  admission_image: REPLACE_WITH_REGISTRY_HOST/inference-admission
  admission_tag: REPLACE_WITH_TAG
  cosign_public_key_secret: REPLACE_WITH_COSIGN_PUBLIC_KEY_SECRET
  approved_model_digest: REPLACE_WITH_APPROVED_MODEL_DIGEST
  cosign_key_uri: REPLACE_WITH_COSIGN_KEY_URI
  promotion_metadata_uri: REPLACE_WITH_PROMOTION_METADATA_URI

model:
  alias: REPLACE_WITH_MODEL_ALIAS
  served_name: REPLACE_WITH_SERVED_MODEL_NAME
  max_context_tokens: 0

engine:
  release_name: REPLACE_WITH_ENGINE_RELEASE
  deployment_name: REPLACE_WITH_ENGINE_DEPLOYMENT
  image_repository: REPLACE_WITH_VLLM_IMAGE_REPOSITORY
  image_tag: REPLACE_WITH_VLLM_IMAGE_TAG
  cache_path: /models/hf-cache
  hf_token_secret_name: REPLACE_WITH_HF_TOKEN_SECRET
  hf_token_secret_key: token

resources:
  gpu_resource_name: nvidia.com/gpu
  gpu_count: 0
  gpu_node_selector_key: REPLACE_WITH_GPU_NODE_SELECTOR_KEY
  gpu_node_selector_value: REPLACE_WITH_GPU_NODE_SELECTOR_VALUE

scaling:
  replicas: REPLACE_WITH_ENGINE_REPLICA_COUNT
  min_replicas: REPLACE_WITH_MIN_REPLICAS
  max_replicas: REPLACE_WITH_MAX_REPLICAS
  keda_queue_threshold: "REPLACE_WITH_QUEUE_THRESHOLD"
  cooldown_period_seconds: 0

observability:
  prometheus_stack_release: REPLACE_WITH_PROMETHEUS_STACK_RELEASE
  release_name: REPLACE_WITH_OBSERVABILITY_RELEASE
  prometheus_url: REPLACE_WITH_PROMETHEUS_URL
  prometheus_service_url: REPLACE_WITH_PROMETHEUS_SERVICE_URL
  otel_namespace: REPLACE_WITH_OTEL_SERVICE_NAMESPACE
  otlp_endpoint: REPLACE_WITH_OTLP_ENDPOINT
  otlp_tls_insecure: false
  otel_collector_image: REPLACE_WITH_OTEL_COLLECTOR_IMAGE_REPOSITORY
  otel_collector_tag: REPLACE_WITH_OTEL_COLLECTOR_IMAGE_TAG
  otel_memory_limit_mib: REPLACE_WITH_OTEL_MEMORY_LIMIT_MIB
  alerts:
    ttft_p95_slo_seconds: REPLACE_WITH_TTFT_P95_SLO_SECONDS
    waiting_to_running_ratio: REPLACE_WITH_WAITING_TO_RUNNING_ALERT_RATIO
    kv_cache_threshold: REPLACE_WITH_KV_CACHE_ALERT_THRESHOLD
    xid_lookback: REPLACE_WITH_XID_ALERT_LOOKBACK
    severities:
      ttft: REPLACE_WITH_TTFT_ALERT_SEVERITY
      queue: REPLACE_WITH_QUEUE_ALERT_SEVERITY
      kv: REPLACE_WITH_KV_ALERT_SEVERITY
      xid: REPLACE_WITH_XID_ALERT_SEVERITY

feature_flags:
  admission_ext_authz_enabled: true
  scheduler_wfq_enabled: true
  scheduler_reserves_enabled: true
  scheduler_heavy_pool_routing_enabled: true
  brownout_enabled: true
  retry_budget_enabled: true
  model_signature_verification_enabled: true
  lora_enabled: false
  guardrails_enabled: false
  disaggregation_enabled: false

scheduler:
  wfq:
    tenants:
      REPLACE_WITH_CRITICAL_TENANT_ID:
        weight: 4
      REPLACE_WITH_STANDARD_TENANT_ID:
        weight: 2
      REPLACE_WITH_SHEDDABLE_TENANT_ID:
        weight: 1
    default_weight: 1
    aging:
      debt_decay_half_life_s: 60
      max_queue_wait_ms:
        Critical: 500
        Standard: 1000
        Sheddable: 2000
  reserves:
    knee_concurrency: REPLACE_WITH_GOODPUT_KNEE_CONCURRENCY
    critical_fraction: 0.30
    standard_fraction: 0.55
    sheddable_fraction: 0.15
    default_tenant_kv_tokens: REPLACE_WITH_DEFAULT_TENANT_KV_TOKENS
    tenant_kv_tokens:
      REPLACE_WITH_CRITICAL_TENANT_ID: REPLACE_WITH_CRITICAL_TENANT_KV_TOKENS
      REPLACE_WITH_STANDARD_TENANT_ID: REPLACE_WITH_STANDARD_TENANT_KV_TOKENS
      REPLACE_WITH_SHEDDABLE_TENANT_ID: REPLACE_WITH_SHEDDABLE_TENANT_KV_TOKENS
  brownout:
    enabled: true
    recovery_hysteresis: 0.03
    stable_recovery_intervals: 2
    standard_max_tokens_cap: REPLACE_WITH_BROWNOUT_STANDARD_MAX_TOKENS
    fallback_model_alias: REPLACE_WITH_BROWNOUT_FALLBACK_MODEL_ALIAS
    rungs:
      - level: 1
        kv_cache_usage_threshold: 0.85
        actions: [shed_sheddable]
      - level: 2
        kv_cache_usage_threshold: 0.90
        actions: [cap_standard_max_tokens, disable_speculative_decoding]
      - level: 3
        kv_cache_usage_threshold: 0.95
        actions: [route_standard_to_fallback_model]
      - level: 4
        kv_cache_usage_threshold: 0.97
        actions: [shed_standard, critical_only]
  routing:
    heavy_threshold_tokens: REPLACE_WITH_HEAVY_CONTEXT_THRESHOLD_TOKENS
    pools:
      critical: REPLACE_WITH_CRITICAL_POOL_NAME
      standard: REPLACE_WITH_STANDARD_POOL_NAME
      heavy: REPLACE_WITH_HEAVY_POOL_NAME

governance:
  promotion:
    artifact_kind: model
    promoted_by: REPLACE_WITH_PROMOTION_ACTOR
    change_request: REPLACE_WITH_CHANGE_REQUEST_ID
    previous_approved_digest: REPLACE_WITH_PREVIOUS_APPROVED_DIGEST
  provenance:
    model_source_uri: REPLACE_WITH_MODEL_SOURCE_URI
    model_license: REPLACE_WITH_MODEL_LICENSE
    model_owner: REPLACE_WITH_MODEL_OWNER
    build_commit: REPLACE_WITH_BUILD_COMMIT
    build_workflow_uri: REPLACE_WITH_BUILD_WORKFLOW_URI
    sbom_attestation_uri: REPLACE_WITH_SBOM_ATTESTATION_URI
    slsa_attestation_uri: REPLACE_WITH_SLSA_ATTESTATION_URI
    model_card_uri: REPLACE_WITH_MODEL_CARD_URI

guardrails:
  image: REPLACE_WITH_GUARDRAIL_IMAGE_REPOSITORY
  tag: REPLACE_WITH_GUARDRAIL_IMAGE_TAG
  service_name: REPLACE_WITH_GUARDRAIL_SERVICE_NAME
  config_name: REPLACE_WITH_GUARDRAIL_CONFIG_NAME
  replicas: REPLACE_WITH_GUARDRAIL_REPLICAS
  default_route: safety_required
  failure_mode: fail_closed
  routes:
    safety_required:
      input_on_unavailable: fail_closed
      output_on_unavailable: fail_closed
    lower_risk:
      input_on_unavailable: fail_open
      output_on_unavailable: fail_open

lora:
  adapter_registry_config_name: REPLACE_WITH_LORA_ADAPTER_REGISTRY_CONFIG
  adapter_locality_label: REPLACE_WITH_ADAPTER_LOCALITY_LABEL
  adapters:
    REPLACE_WITH_ADAPTER_ID:
      artifact: oci://REPLACE_WITH_REGISTRY_HOST/adapters/REPLACE_WITH_ADAPTER@REPLACE_WITH_APPROVED_ADAPTER_DIGEST
      approved_digest: REPLACE_WITH_APPROVED_ADAPTER_DIGEST
      promotion_metadata_uri: REPLACE_WITH_ADAPTER_PROMOTION_METADATA_URI
      rank: 64
      enabled: true

frontier:
  profile_name: REPLACE_WITH_FRONTIER_PROFILE_NAME
  model:
    alias: REPLACE_WITH_FRONTIER_MODEL_ALIAS
    served_name: REPLACE_WITH_FRONTIER_SERVED_MODEL_NAME
    artifact: oci://REPLACE_WITH_REGISTRY_HOST/models/REPLACE_WITH_FRONTIER_MODEL:REPLACE_WITH_SIGNED_TAG
    max_model_len: 0
  fabric:
    topology_class: REPLACE_WITH_FABRIC_TOPOLOGY_CLASS
    nccl_ib_hca: REPLACE_WITH_NCCL_IB_HCA
    busbw_min_fraction_theoretical: "REPLACE_WITH_FABRIC_BUSBW_MIN_FRACTION"
  parallelism:
    tensor_parallel_size: 0
    pipeline_parallel_size: 0
    expert_parallel_size: 0
    process_group_failure_domain: REPLACE_WITH_PROCESS_GROUP_FAILURE_DOMAIN
  nccl:
    job_name: REPLACE_WITH_NCCL_JOB_NAME
    image: REPLACE_WITH_NCCL_TESTS_IMAGE
    tests_path: REPLACE_WITH_NCCL_TESTS_PATH
    macro_min_bytes: REPLACE_WITH_NCCL_MACRO_MIN_BYTES
    macro_max_bytes: REPLACE_WITH_NCCL_MACRO_MAX_BYTES
    micro_min_bytes: REPLACE_WITH_NCCL_MICRO_MIN_BYTES
    micro_max_bytes: REPLACE_WITH_NCCL_MICRO_MAX_BYTES
    micro_algo: REPLACE_WITH_NCCL_MICRO_ALGO
    micro_proto: REPLACE_WITH_NCCL_MICRO_PROTO
  moe:
    max_expert_imbalance_ratio: "REPLACE_WITH_MAX_EXPERT_IMBALANCE_RATIO"
    hot_expert_policy: REPLACE_WITH_HOT_EXPERT_POLICY
    fallback_pool: REPLACE_WITH_MOE_FALLBACK_POOL
  disaggregation:
    profile_name: REPLACE_WITH_DISAGG_PROFILE_NAME
    kv_transfer_connector: REPLACE_WITH_KV_TRANSFER_CONNECTOR
    prefill_pool_deployment: REPLACE_WITH_PREFILL_POOL_DEPLOYMENT
    decode_pool_deployment: REPLACE_WITH_DECODE_POOL_DEPLOYMENT
    prefill_pool_service: REPLACE_WITH_PREFILL_POOL_SERVICE
    decode_pool_service: REPLACE_WITH_DECODE_POOL_SERVICE
    prefill_kv_endpoint: REPLACE_WITH_PREFILL_KV_ENDPOINT
    decode_kv_endpoint: REPLACE_WITH_DECODE_KV_ENDPOINT
    kv_transfer_timeout_ms: 0
    monolithic_fallback_pool: REPLACE_WITH_MONOLITHIC_FALLBACK_POOL
  xid_watcher:
    image: REPLACE_WITH_XID_WATCHER_IMAGE
    service_account: REPLACE_WITH_XID_WATCHER_SERVICE_ACCOUNT
    cluster_role: REPLACE_WITH_XID_WATCHER_CLUSTER_ROLE
    cluster_role_binding: REPLACE_WITH_XID_WATCHER_CLUSTER_ROLE_BINDING
    config_name: REPLACE_WITH_XID_WATCHER_CONFIG_NAME
    daemonset: REPLACE_WITH_XID_WATCHER_DAEMONSET
    target_pod_selector: REPLACE_WITH_XID_TARGET_POD_SELECTOR
    drain_timeout: REPLACE_WITH_XID_DRAIN_TIMEOUT

security:
  service_mesh_mtls_required: REPLACE_WITH_TRUE_OR_FALSE
  audit_sink: REPLACE_WITH_AUDIT_SINK
  certificate_issuer: REPLACE_WITH_CERTIFICATE_ISSUER

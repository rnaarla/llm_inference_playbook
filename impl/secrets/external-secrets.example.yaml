apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: REPLACE_WITH_HF_TOKEN_EXTERNAL_SECRET
  namespace: REPLACE_WITH_INFERENCE_NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE_NAME
    kind: REPLACE_WITH_SECRET_STORE_KIND
  target:
    name: REPLACE_WITH_HF_TOKEN_SECRET
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: REPLACE_WITH_HF_TOKEN_REMOTE_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: REPLACE_WITH_COSIGN_PUBLIC_KEY_EXTERNAL_SECRET
  namespace: REPLACE_WITH_INFERENCE_NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE_NAME
    kind: REPLACE_WITH_SECRET_STORE_KIND
  target:
    name: REPLACE_WITH_COSIGN_PUBLIC_KEY_SECRET
    creationPolicy: Owner
  data:
    - secretKey: cosign.pub
      remoteRef:
        key: REPLACE_WITH_COSIGN_PUBLIC_KEY_REMOTE_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: REPLACE_WITH_REGISTRY_PULL_SECRET_EXTERNAL_SECRET
  namespace: REPLACE_WITH_INFERENCE_NAMESPACE
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_WITH_SECRET_STORE_NAME
    kind: REPLACE_WITH_SECRET_STORE_KIND
  target:
    name: REPLACE_WITH_REGISTRY_PULL_SECRET
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: REPLACE_WITH_REGISTRY_PULL_SECRET_REMOTE_KEY

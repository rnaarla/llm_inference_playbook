name: Bug report
description: Report a problem with docs, scaffolds, or offline checks.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile
      placeholder: h100-vllm-kserve
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Include `make -C playbook offline` output if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Do not paste secrets or real environment values.

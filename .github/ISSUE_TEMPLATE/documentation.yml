name: Documentation issue
description: Report unclear, missing, or inconsistent documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: docs/design-choices.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
    validations:
      required: true
